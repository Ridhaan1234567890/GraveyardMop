name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # change to your default branch if it isn't main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true # <--- THIS TELLS GITHUB TO FETCH THE REAL LFS FILE

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Serves your root directory where index.html is located

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
